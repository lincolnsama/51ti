    .options { display: flex; flex-direction: column; gap: 10px; flex: 1; }
    .option-btn { background: #1a1a2e; border: 1.5px solid #2a2a50; border-radius: 12px; padding: 14px 16px; color: #c0c0d8; font-size: 14px; text-align: left; cursor: pointer; transition: all 0.2s; line-height: 1.4; }

    .result-badge { font-size: 11px; letter-spacing: 3px; color: #f7c948; margin-bottom: 12px; }

var personas = {
  'PTBS': { cn: '卷王牛马', en: 'Pusher Ox', desc: '你是办公室里最早到、最晚走的那一个。领导的消息你秒回，加班通知你接活。团队的事就是你的事，责任心强到停不下来。辛苦了，卷王。', tags: ['责任心爆棚', '领导最爱', '全勤标兵'] },
  'PTBO': { cn: '拼命三郎', en: '996 Survivor', desc: '你是那个连续加班一周还笑着说"没事"的狠人。别人在抱怨，你已经在改了。别人在摸鱼，你在写方案。你不是不累，是不敢累。', tags: ['抗压王者', 'Deadline Fighter', '铁打的'] },
  'PTRS': { cn: '效率刺客', en: 'Slackmaster General', desc: '你看起来很忙，其实你很会忙。消息秒回、会议必到、表格填满，但你总能在最后关头精准完成。时间管理大师。', tags: ['效率高手', '社交达人', '时间管理大师'] },
  'PTRO': { cn: '节奏大师', en: 'Chaos Coordinator', desc: '你永远在救火的路上，同时还在组织下一场火。混乱是你最熟悉的战场，先干了再说。你是团队的多线程处理器。', tags: ['多线程战士', '救火队长', '边干边想'] },
  'PGBS': { cn: '吃瓜狗', en: 'Pro Gossipper', desc: '你是办公室的情报中心，谁要离职、谁和谁有矛盾、哪个部门要合并，你第一个知道。你独立但也爱八卦——活是干的，瓜也不能落下。', tags: ['情报大师', '社交润滑剂', '消息灵通'] },
  'PGBO': { cn: '社交蝴蝶', en: 'Social Butterfly', desc: '你的工作就是维持办公室的人际关系。群消息你秒回，会议你捧场，聚餐你组织。你的社交能力让你在职场如鱼得水。', tags: ['社交高手', '气氛组', '人脉王'] },

var currentQ = 0;
var answers = [];
var opposite = { P: 'L', L: 'P', T: 'G', G: 'T', B: 'R', R: 'B', S: 'O', O: 'S' };

function startTest() {
  currentQ = 0;
  answers = [];
  showPage('page-test');
  renderProgressDots();
  renderQuestion();
}

function renderProgressDots() {
  var container = document.getElementById('progress-dots');
  container.innerHTML = '';
  for (var i = 0; i < questions.length; i++) {
    var d = document.createElement('div');
    d.className = 'dot' + (i < currentQ ? ' done' : (i === currentQ ? ' current' : ''));
    container.appendChild(d);
  }
}

function renderQuestion() {
  var q = questions[currentQ];
  document.getElementById('q-emoji').textContent = q.emoji;
  document.getElementById('q-number').textContent = 'Q' + (currentQ + 1);
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('progress-text').textContent = '第 ' + (currentQ + 1) + ' / ' + questions.length + ' 题';
  document.getElementById('progress-fill').style.width = (((currentQ + 1) / questions.length) * 100).toFixed(1) + '%';
  var opts = document.getElementById('options');
  opts.innerHTML = '';
  for (var i = 0; i < q.opts.length; i++) {
    var winDim = i === 0 ? q.dim : opposite[q.dim];
    var btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = q.opts[i];
    (function(wd, b) {
      b.onclick = function() { answer(wd, b); };
    })(winDim, btn);
    opts.appendChild(btn);
  }
  renderProgressDots();
}

function answer(winDim, btn) {
  answers[currentQ] = winDim;
  var allBtns = document.querySelectorAll('.option-btn');
  for (var i = 0; i < allBtns.length; i++) {
    allBtns[i].style.pointerEvents = 'none';
    allBtns[i].style.opacity = '0.5';
  }
  btn.style.opacity = '1';
  btn.style.borderColor = '#ff6b35';
  btn.classList.add('selected');
  setTimeout(function() {
    currentQ++;
    if (currentQ < questions.length) {
      renderQuestion();
    } else {
      showResult();
    }
  }, 300);
}

function showResult() {
  var scores = { P: 0, L: 0, T: 0, G: 0, B: 0, R: 0, S: 0, O: 0 };
  for (var i = 0; i < answers.length; i++) {
    var dim = answers[i];
    if (dim) scores[dim]++;
  }
  var dim1 = scores.P >= scores.L ? 'P' : 'L';
  var dim2 = scores.T >= scores.G ? 'T' : 'G';
  var dim3 = scores.B >= scores.R ? 'B' : 'R';
  var dim4 = scores.S >= scores.O ? 'S' : 'O';
  var type = dim1 + dim2 + dim3 + dim4;
  var p = personas[type];
  if (!p) {
    document.getElementById('result-type').textContent = '???';
    document.getElementById('result-cn').textContent = '人格未识别（' + type + '）';
    showPage('page-result');
    return;
  }
  document.getElementById('result-type').textContent = p.cn;
  document.getElementById('result-cn').textContent = p.en;
  document.getElementById('result-desc').textContent = p.desc;
  var tagsEl = document.getElementById('result-tags');
  tagsEl.innerHTML = '';
  for (var i = 0; i < p.tags.length; i++) {
    var span = document.createElement('span');
    span.className = 'tag';
    span.textContent = p.tags[i];
    tagsEl.appendChild(span);
  }
  showPage('page-result');
}

function showPage(id) {
  var pages = document.querySelectorAll('.page');
  for (var i = 0; i < pages.length; i++) { pages[i].classList.remove('active'); }
  document.getElementById(id).classList.add('active');
}

function restartTest() { startTest(); }
function showShareTip() { document.getElementById('share-tip').classList.add('active'); }
function hideShareTip() { document.getElementById('share-tip').classList.remove('active'); }

function updateCountdown() {
  var wuyi = new Date('2026-05-01');
  var now = new Date();
  var diff = Math.ceil((wuyi - now) / (1000 * 60 * 60 * 24));
  document.getElementById('days-to-51').textContent = diff > 0 ? diff : '今天！';
}

updateCountdown();
</script>
